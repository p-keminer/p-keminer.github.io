name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

# Voruebergehender Wartungsmodus. Fuer den normalen App-Deploy wieder auf "false" setzen.
env:
  MAINTENANCE_MODE: "false"

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build maintenance page
        if: env.MAINTENANCE_MODE == 'true'
        run: |
          rm -rf dist
          mkdir -p dist
          cp maintenance/index.html dist/index.html
          cp maintenance/index.html dist/404.html
          cp maintenance/rechtliches.html dist/rechtliches.html
          cp public/favicon.svg dist/favicon.svg
          mkdir -p dist/.well-known
          cp public/.well-known/security.txt dist/.well-known/security.txt

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        if: env.MAINTENANCE_MODE != 'true'
        run: npm ci

      - name: Audit dependencies
        if: env.MAINTENANCE_MODE != 'true'
        run: npm audit --audit-level=high

      - name: Build 3D shell
        if: env.MAINTENANCE_MODE != 'true'
        run: npm run build

      - name: Verify dist contents
        run: |
          ls -la dist/
          test -f dist/index.html
          test -f dist/404.html
          if [ "$MAINTENANCE_MODE" = "true" ]; then
            grep -q "Zurzeit in Bearbeitung" dist/index.html
            test -f dist/rechtliches.html
            test -f dist/favicon.svg
            test -f dist/.well-known/security.txt
            test "$(find dist -type f | wc -l)" -eq 5
            node scripts/verify_static_security.mjs --maintenance
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
