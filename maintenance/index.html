<!doctype html>
<html lang="de">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; base-uri 'none'; object-src 'none'; script-src 'none'; style-src 'sha256-SmxxDBH2n2kCduqEm/qsfZ461WPI107xNxch4BcnOvo='; img-src 'self'; font-src 'none'; connect-src 'none'; worker-src 'none'; frame-src 'none'; media-src 'none'; form-action 'none'; manifest-src 'none'"
    />
    <meta name="description" content="Das Portfolio von Philip Keminer wird aktuell überarbeitet." />

    <title>Zurzeit in Bearbeitung | Philip Keminer</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2026-08-10-chip-shield" />
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        background: #080605;
        color: #f4eee7;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        grid-template-rows: 1fr auto;
        min-height: 100vh;
        min-height: 100dvh;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 10% 12%, rgba(104, 160, 171, 0.07), transparent 30rem),
          radial-gradient(circle at 90% 88%, rgba(201, 105, 54, 0.1), transparent 32rem),
          #080605;
      }

      main {
        display: grid;
        width: min(100% - 32px, 1120px);
        margin-inline: auto;
        place-items: center;
        padding-block: 64px;
      }

      h1 {
        margin: 0;
        color: #fffaf4;
        font-size: clamp(2.8rem, 9vw, 7.6rem);
        font-weight: 720;
        letter-spacing: -0.065em;
        line-height: 0.95;
        text-align: center;
      }

      footer {
        display: flex;
        width: min(100% - 40px, 1120px);
        min-height: 76px;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-inline: auto;
        border-top: 1px solid rgba(244, 238, 231, 0.1);
        color: #7f756e;
        font: 600 0.68rem/1.4 ui-monospace, "Cascadia Mono", monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .legal-links {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px 18px;
      }

      .legal-links a {
        color: #948981;
        text-decoration: none;
        transition: color 160ms ease;
      }

      .legal-links a:hover {
        color: #e6d8cc;
      }

      .legal-links a:focus-visible {
        border-radius: 2px;
        outline: 2px solid #dda270;
        outline-offset: 4px;
      }

      @media (max-width: 620px) {
        main {
          width: min(100% - 28px, 1120px);
          padding-block: 48px;
        }

        h1 {
          font-size: clamp(2.65rem, 15vw, 4.25rem);
        }

        footer {
          width: min(100% - 28px, 1120px);
          min-height: 88px;
          align-items: flex-start;
          flex-direction: column;
          justify-content: center;
          gap: 5px;
        }

        .legal-links {
          justify-content: flex-start;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .legal-links a {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Zurzeit in Bearbeitung</h1>
    </main>

    <footer>
      <span>p-keminer</span>
      <nav class="legal-links" aria-label="Rechtliche Informationen">
        <a href="/rechtliches.html#impressum">Impressum</a>
        <a href="/rechtliches.html#datenschutz">Datenschutz</a>
      </nav>
    </footer>
  </body>
