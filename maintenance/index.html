<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src 'none'; font-src 'none'; connect-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="description" content="Das Portfolio von Philip Keminer wird aktuell überarbeitet." />
    <meta name="robots" content="noindex, follow, noarchive" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#080605" />
    <title>Zurzeit in Bearbeitung | Philip Keminer</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        background: #080605;
        color: #f4eee7;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: #080605;
      }

      body {
        display: grid;
        grid-template-rows: auto 1fr auto;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 8% 12%, rgba(104, 160, 171, 0.09), transparent 31rem),
          radial-gradient(circle at 88% 88%, rgba(201, 105, 54, 0.14), transparent 34rem),
          linear-gradient(135deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px),
          #080605;
        background-size: auto, auto, 28px 28px, auto;
      }

      .site-header,
      .site-footer,
      main {
        width: min(100% - 40px, 1120px);
        margin-inline: auto;
      }

      .site-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 92px;
        border-bottom: 1px solid rgba(244, 238, 231, 0.1);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 13px;
        color: #f4eee7;
        text-decoration: none;
      }

      .brand-mark {
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        border: 1px solid rgba(226, 151, 96, 0.36);
        border-radius: 12px;
        background: rgba(208, 111, 57, 0.11);
        color: #f4d5bd;
        font: 750 0.88rem/1 ui-monospace, "Cascadia Mono", monospace;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
      }

      .brand-name {
        font-weight: 680;
        letter-spacing: -0.015em;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        color: #b9afa6;
        font: 650 0.72rem/1.2 ui-monospace, "Cascadia Mono", monospace;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #dc8a52;
        box-shadow: 0 0 0 5px rgba(220, 138, 82, 0.08), 0 0 18px rgba(220, 138, 82, 0.5);
        animation: status-pulse 2.6s ease-in-out infinite;
      }

      main {
        display: grid;
        align-content: center;
        padding-block: clamp(72px, 13vh, 150px);
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 0 0 22px;
        color: #d79768;
        font: 700 0.72rem/1.3 ui-monospace, "Cascadia Mono", monospace;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        width: 34px;
        height: 1px;
        background: currentColor;
        content: "";
        opacity: 0.72;
      }

      h1 {
        max-width: 12ch;
        margin: 0;
        color: #fffaf4;
        font-size: clamp(3.35rem, 9.6vw, 7.9rem);
        font-weight: 720;
        letter-spacing: -0.07em;
        line-height: 0.88;
      }

      h1 span {
        color: #b9afa6;
      }

      .lead {
        max-width: 650px;
        margin: clamp(30px, 5vw, 50px) 0 0;
        color: #cfc5bc;
        font-size: clamp(1rem, 2vw, 1.18rem);
        line-height: 1.72;
      }

      .lead strong {
        color: #fff7ef;
        font-weight: 650;
      }

      .progress-line {
        width: min(100%, 650px);
        height: 1px;
        margin-top: 31px;
        overflow: hidden;
        background: rgba(244, 238, 231, 0.12);
      }

      .progress-line span {
        display: block;
        width: 38%;
        height: 100%;
        background: linear-gradient(90deg, #9c5631, #dda270);
        box-shadow: 0 0 16px rgba(221, 162, 112, 0.35);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 32px;
      }

      .action {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        padding: 0 18px;
        border: 1px solid rgba(244, 238, 231, 0.14);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.025);
        color: #e8dfd7;
        font-size: 0.82rem;
        font-weight: 650;
        text-decoration: none;
        transition: border-color 160ms ease, background 160ms ease, color 160ms ease, transform 160ms ease;
      }

      .action:hover {
        border-color: rgba(222, 153, 103, 0.5);
        background: rgba(208, 111, 57, 0.1);
        color: #fff8f1;
        transform: translateY(-1px);
      }

      .action:focus-visible,
      .brand:focus-visible {
        outline: 2px solid #dda270;
        outline-offset: 4px;
      }

      .site-footer {
        display: flex;
        min-height: 76px;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        border-top: 1px solid rgba(244, 238, 231, 0.1);
        color: #7f756e;
        font: 600 0.68rem/1.4 ui-monospace, "Cascadia Mono", monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .site-footer span:last-child {
        text-align: right;
      }

      .legal-links {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px 18px;
      }

      .legal-links a {
        color: #948981;
        text-decoration: none;
        transition: color 160ms ease;
      }

      .legal-links a:hover {
        color: #e6d8cc;
      }

      .legal-links a:focus-visible {
        border-radius: 2px;
        outline: 2px solid #dda270;
        outline-offset: 4px;
      }

      @keyframes status-pulse {
        0%,
        100% {
          opacity: 0.7;
          transform: scale(0.92);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @media (max-width: 620px) {
        .site-header,
        .site-footer,
        main {
          width: min(100% - 28px, 1120px);
        }

        .site-header {
          min-height: 78px;
        }

        .status {
          font-size: 0.61rem;
          letter-spacing: 0.07em;
        }

        main {
          padding-block: 64px;
        }

        h1 {
          font-size: clamp(3rem, 17vw, 5rem);
        }

        .site-footer {
          min-height: 88px;
          align-items: flex-start;
          flex-direction: column;
          justify-content: center;
          gap: 5px;
        }

        .site-footer span:last-child {
          text-align: left;
        }

        .legal-links {
          justify-content: flex-start;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .status-dot {
          animation: none;
        }

        .action {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="Startseite von p-keminer">
        <span class="brand-mark" aria-hidden="true">pk</span>
        <span class="brand-name">p-keminer</span>
      </a>
      <span class="status"><span class="status-dot" aria-hidden="true"></span>Wartungsmodus</span>
    </header>

    <main>
      <p class="eyebrow">Portfolio // Redesign</p>
      <h1>Zurzeit in <span>Bearbeitung.</span></h1>
      <p class="lead">
        Ich überarbeite mein Portfolio derzeit grundlegend – inklusive des neuen
        <strong>3D-Raums</strong>, der Navigation und der Inhalte. Die Website ist bald wieder verfügbar.
      </p>
      <div class="progress-line" aria-hidden="true"><span></span></div>
      <nav class="actions" aria-label="Externe Profile">
        <a class="action" href="https://github.com/p-keminer" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a class="action" href="https://www.linkedin.com/in/philip-keminer/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      </nav>
    </main>

    <footer class="site-footer">
      <span>p-keminer</span>
      <nav class="legal-links" aria-label="Rechtliche Informationen">
        <a href="/rechtliches.html#impressum">Impressum</a>
        <a href="/rechtliches.html#datenschutz">Datenschutz</a>
      </nav>
    </footer>
  </body>
</html>
