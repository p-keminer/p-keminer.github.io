      <h2 data-profile-segment="0">Hi, ich bin Philip 👋</h2>
      <p>Ich bin Quereinsteiger im Tech-Bereich und studiere aktuell Digitalisierung und Informationstechnik an der THGA Bochum.</p>
      <p>Besonders interessieren mich die Bereiche IT-Sicherheit, systemnahe Programmierung, Netzwerke und Embedded Systems.</p>

      <h3>Aktuelle Schwerpunkte</h3>
      <ul>
        <li><strong>Cybersecurity:</strong> Grundlagen der IT-Sicherheit, Angriffsmethoden, Schwachstellenanalyse und defensive Sicherheitsmaßnahmen</li>
        <li><strong>Netzwerke:</strong> Netzwerkprotokolle, Datenpakete, Schnittstellen und Kommunikation zwischen Systemen</li>
        <li><strong>Linux:</strong> Administration, Shell, CLI-Tools, Dateisysteme, Benutzerrechte und Netzwerkdienste</li>
        <li><strong>Windows und Active Directory:</strong> Windows-Administration, Benutzer- und Rechteverwaltung sowie grundlegende AD-Konzepte</li>
        <li><strong>PowerShell:</strong> Syntax, Scripting und Automatisierung administrativer Aufgaben</li>
        <li><strong>C und C++:</strong> Systemnahe und objektorientierte Programmierung, Datenstrukturen und Speicherverwaltung</li>
        <li><strong>Embedded Systems:</strong> Mikrocontroller, Einplatinencomputer, Sensorik, Schnittstellen und hardwarenahe Entwicklung</li>
      </ul>

      <h3>Aktuelle Projekte</h3>
      <h4>Raspberry Pi und Netzwerksicherheit</h4>
      <p>Aufbau und Konfiguration eines Raspberry-Pi-Systems als Lernplattform für Linux, Netzwerkkommunikation und WLAN-Sicherheitskonzepte.</p>
      <h4>ESP32 und Embedded Development</h4>
      <p>Entwicklung und Anpassung von ESP32-basierten Hardwareprojekten mit Displays, externen Antennen und verschiedenen Schnittstellen.</p>

      <h3>Praktische Erfahrungen</h3>
      <h4 data-profile-segment="1"><a href="https://github.com/p-keminer/remote-controlled-robot-arm" target="_blank" rel="noopener noreferrer" aria-label="IMU-gesteuerter Roboter Arm auf GitHub öffnen (neuer Tab)">IMU-gesteuerter Roboter Arm</a></h4>
      <p>Entwicklung eines IMU-gesteuerten 5-DOF-Roboterarms mit ESP32, ESP-NOW, I2C und MQTT sowie einer Visualisierung als digitaler Zwilling über ROS 2.</p>
      <h4 data-profile-segment="2"><a href="https://github.com/p-keminer/iot-alarm-system" target="_blank" rel="noopener noreferrer" aria-label="IoT Alarm System auf GitHub öffnen (neuer Tab)">IoT Alarm System</a></h4>
      <p>Entwicklung einer IoT-Alarmanlage mit ESP8266-Nodes, Arduino Uno, verschiedenen Sensoren und RFID-Zugangskontrolle sowie einem Raspberry-Pi-Dashboard zur Überwachung und Steuerung.</p>
